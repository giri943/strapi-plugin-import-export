name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which records in the registry that this tarball was built
      # by this workflow from this commit.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Full check
        run: npm run check:all

      # npm only issues a provenance attestation for a package built from a public repository,
      # because the attestation itself is public. Asking for it from a private repository fails
      # the publish outright, so the flag is added only when it can be honoured.
      - name: Publish
        run: |
          if [ "${{ github.event.repository.visibility }}" = "public" ]; then
            npm publish --access public --provenance
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
